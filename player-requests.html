<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Заявки игроков, ищущих мастера.">
  <title>Игроки ищут мастера — D&D Finder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body data-catalog="player-requests">
  <div id="site-header"></div>
  <main class="container my-5">
    <nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="index.html">Главная</a></li><li class="breadcrumb-item active">Заявки игроков</li></ol></nav>
    <div class="alert alert-info" role="alert">Игроки оставляют заявки на поиск мастера и компании.</div>
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h2 mb-0">Игроки ищут мастера</h1>
      <span class="text-muted" id="catalogCounter"></span>
    </div>
    <div class="row g-4">
      <aside class="col-12 col-lg-3">
        <div class="card shadow-sm filter-sticky"><div class="card-body">
          <form id="filterForm"><div id="filterBox"></div>
            <div class="d-grid gap-2 mt-3">
              <button class="btn btn-primary" type="submit">Применить</button>
              <button class="btn btn-outline-secondary" type="button" id="resetFilters">Сбросить</button>
            </div>
          </form>
        </div></div>
      </aside>
      <section class="col-12 col-lg-9">
        <div class="mb-3"><label for="sortSelect" class="form-label">Сортировка</label><select id="sortSelect" class="form-select w-auto"></select></div>
        <div class="row g-4" id="catalogGrid"></div>
        <div id="catalogPag"></div>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
