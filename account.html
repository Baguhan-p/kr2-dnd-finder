<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Личный кабинет D&D Finder: профиль, заявки, избранное.">
  <title>Личный кабинет — D&D Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
  <script src="js/motion.js"></script>
</head>
<body>
  <div id="site-header"></div>
  <main class="container my-5">
    <nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="index.html">Главная</a></li><li class="breadcrumb-item active">Личный кабинет</li></ol></nav>
    <h1 class="h2 mb-4">Личный кабинет</h1>
    <div class="row g-4">
      <div class="col-12 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-header"><h2 class="h5 mb-0">Мой профиль</h2></div>
          <div class="card-body">
            <form id="accountForm" novalidate>
              <div class="mb-3"><label class="form-label" for="acc-name">Имя / прозвище *</label><input id="acc-name" class="form-control" required minlength="2"><div class="invalid-feedback">Укажите имя (минимум 2 символа).</div></div>
              <div class="mb-3"><label class="form-label" for="acc-role">Роль</label><select id="acc-role" class="form-select"><option value="player">Игрок</option><option value="master">Мастер</option></select></div>
              <div class="mb-3"><label class="form-label" for="acc-exp">Опыт (лет)</label><input id="acc-exp" type="number" min="0" max="50" value="0" class="form-control"></div>
              <div class="mb-3"><span class="form-label d-block">Системы</span><div id="acc-systems"></div></div>
              <div class="mb-3"><label class="form-label" for="acc-format">Формат</label><select id="acc-format" class="form-select"><option>Онлайн</option><option>Офлайн</option></select></div>
              <div class="mb-3"><label class="form-label" for="acc-city">Город</label><input id="acc-city" class="form-control"></div>
              <div class="mb-3"><label class="form-label" for="acc-bio">О себе</label><textarea id="acc-bio" class="form-control" rows="3"></textarea></div>
              <div class="mb-3"><label class="form-label" for="acc-avatar">Фото профиля (до 300 КБ)</label><input id="acc-avatar" type="file" accept="image/*" class="form-control"></div>
              <button class="btn btn-primary w-100" type="submit">Сохранить профиль</button>
            </form>
          </div>
        </div>
      </div>
      <div class="col-12 col-lg-7">
        <h2 class="h5 mb-3">Как меня видят другие</h2>
        <div id="accountPreview" class="mb-4"></div>
        <h2 class="h5 mb-3">Мои заявки</h2>
        <ul class="list-group mb-4" id="myRequests"></ul>
        <a class="btn btn-outline-primary" href="favorites.html">♡ Моё избранное</a>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
  <script src="js/account.js"></script>
</body>
</html>
