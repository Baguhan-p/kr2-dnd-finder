<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <meta name="description" content="Анкеты мастеров D&D, Pathfinder, Call of Cthulhu. Фильтры по системе, формату, городу и опыту.">
  <title>Анкеты мастеров — D&D Finder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body data-catalog="masters">
  <div id="site-header"></div>
  <main class="container my-5">
    <nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="index.html">Главная</a></li><li class="breadcrumb-item active">Мастера</li></ol></nav>
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <h1 class="h2 mb-0">Мастера</h1>
      <div class="d-flex align-items-center gap-3">
        <span class="text-muted" id="catalogCounter"></span>
        <a class="btn btn-outline-primary btn-sm" href="search.html?type=master">Поиск мастеров</a>
      </div>
    </div>

    <ul class="nav nav-tabs mb-4" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" type="button" role="tab" data-cat-type="masters" aria-selected="true">Анкеты мастеров</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" type="button" role="tab" data-cat-type="master-requests" aria-selected="false">Заявки мастеров</button>
      </li>
    </ul>

    <div class="row g-4">
      <aside class="col-12 col-lg-3">
        <div class="card shadow-sm filter-sticky"><div class="card-body">
          <form id="filterForm">
            <div id="filterBox"></div>
            <div class="d-grid gap-2 mt-3">
              <button class="btn btn-primary" type="submit">Применить</button>
              <button class="btn btn-outline-secondary" type="button" id="resetFilters">Сбросить</button>
            </div>
          </form>
        </div></div>
      </aside>
      <section class="col-12 col-lg-9">
        <div class="mb-3"><label for="sortSelect" class="form-label">Сортировка</label>
          <select id="sortSelect" class="form-select w-auto"></select></div>
        <div class="row g-4" id="catalogGrid"></div>
        <div id="catalogPag"></div>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
