<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <meta name="description" content="Единый поиск по мастерам, игрокам и заявкам с фильтрами по типу, системе, формату и городу.">
  <title>Глобальный поиск — D&D Finder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
  <script src="js/motion.js"></script>
</head>
<body>
  <div id="site-header"></div>
  <main class="container my-5">
    <nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="index.html">Главная</a></li><li class="breadcrumb-item active">Поиск</li></ol></nav>
    <h1 class="h2 mb-4">Глобальный поиск</h1>
    <div class="card shadow-sm mb-4"><div class="card-body">
      <form id="searchForm">
        <div class="row g-3">
          <div class="col-12 col-lg-6"><label for="qInput" class="form-label">Ключевые слова</label><input id="qInput" type="search" class="form-control" placeholder="Имя, кампания, описание..."></div>
          <div class="col-12 col-md-6 col-lg-3"><label for="typeSelect" class="form-label">Тип</label>
            <select id="typeSelect" class="form-select">
              <option value="">Все</option><option value="master">Мастера</option><option value="player">Игроки</option>
              <option value="master-request">Заявки мастеров</option><option value="player-request">Заявки игроков</option>
            </select></div>
          <div class="col-12 col-md-6 col-lg-3"><label for="sysSelect" class="form-label">Система</label>
            <select id="sysSelect" class="form-select"><option value="">Любая</option>
              <option>D&amp;D 5e</option><option>Pathfinder</option><option>Call of Cthulhu</option><option>Savage Worlds</option><option>Shadowrun</option><option>Cyberpunk RED</option>
            </select></div>
          <div class="col-12 col-md-6 col-lg-3"><label for="fmtSelect" class="form-label">Формат</label>
            <select id="fmtSelect" class="form-select"><option value="">Любой</option><option>Онлайн</option><option>Офлайн</option></select></div>
          <div class="col-12 col-md-6 col-lg-3"><label for="cityInput" class="form-label">Город</label><input id="cityInput" type="text" class="form-control" placeholder="Город"></div>
          <div class="col-12 d-flex align-items-end"><button class="btn btn-primary" type="submit">Найти</button></div>
        </div>
      </form>
    </div></div>
    <p class="text-muted" id="searchCounter"></p>
    <div class="row g-4" id="searchResults"></div>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/search.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
